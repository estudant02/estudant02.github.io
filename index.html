<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d16">
  <title>Não há nada por aqui — DY PROJECTS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d16;
      --panel: #101e2c;
      --line: #20394d;
      --cyan: #39d9ed;
      --text: #e5f5ff;
      --muted: #91a8ba;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(24, 91, 112, .19), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 560px);
      text-align: center;
      padding: 52px 32px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(16, 30, 44, .78);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
    }

    .logo {
      margin-bottom: 42px;
      color: var(--cyan);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .symbol {
      width: 92px;
      height: 92px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(57, 217, 237, .35);
      border-radius: 50%;
      color: var(--cyan);
      background: rgba(57, 217, 237, .06);
      font-size: 39px;
      box-shadow: 0 0 38px rgba(57, 217, 237, .08);
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 39px);
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .rule {
      width: 46px;
      height: 2px;
      margin: 30px auto 0;
      border-radius: 2px;
      background: var(--cyan);
      opacity: .8;
    }

    footer {
      margin-top: 38px;
      color: #637b8e;
      font-size: 10px;
      letter-spacing: .16em;
    }

    @media (max-width: 480px) {
      main { padding: 42px 22px; }
      .logo { margin-bottom: 34px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">DY PROJECTS</div>
    <div class="symbol" aria-hidden="true">⌁</div>
    <h1>Não há nada por aqui.</h1>
    <p>Esta página ainda não tem conteúdo.<br>Volte em breve para conferir as novidades.</p>
    <div class="rule"></div>
    <footer>HARDWARE · FIRMWARE · PCB · 3D</footer>
  </main>
</body>
</html>
